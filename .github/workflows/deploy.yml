name: Check and deploy website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-roam-${{ github.ref }}
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check
      - name: Require committed generated pages
        run: test -z "$(git status --porcelain)"
      - name: Test deployment safeguards
        run: python3 -m unittest discover -s tests -p 'test_deploy.py'
      - name: Test Obsidian status publisher
        run: python3 -m unittest discover -s tests -p 'test_obsidian_status.py'
      - name: Test local Obsidian line metrics collector
        run: python3 -m unittest discover -s tests -p 'test_obsidian_line_metrics.py'
      - name: Configure temporary Alibaba Cloud credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ vars.ALIYUN_DEPLOY_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com
      - name: Install verified Alibaba Cloud CLI
        run: |
          curl -fsSL --retry 3 https://github.com/aliyun/aliyun-cli/releases/download/v3.5.0/aliyun-cli-linux-3.5.0-amd64.tgz -o "$RUNNER_TEMP/aliyun.tgz"
          echo "f97640bd11002f26e19c4f0b4725a3695e37b43499268837f35dd938cbe043aa  $RUNNER_TEMP/aliyun.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aliyun-bin"
          tar -xzf "$RUNNER_TEMP/aliyun.tgz" -C "$RUNNER_TEMP/aliyun-bin"
          echo "$RUNNER_TEMP/aliyun-bin" >> "$GITHUB_PATH"
      - name: Test CLI without a configured region
        run: python3 -m unittest discover -s tests -p 'test_deploy_cli.py'
      - name: Deploy and verify public website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ALIYUN_REGION: cn-shanghai
          ALIYUN_INSTANCE_ID: ${{ vars.ALIYUN_INSTANCE_ID }}
        run: python3 scripts/deploy-aliyun.py
